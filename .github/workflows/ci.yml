name: CI and weekly release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
      timezone: Europe/Berlin

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'weekly-release' || github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ {print}' | sort -V | tail -1)
          if [[ -n "$latest" ]] && git diff --quiet "$latest" "$GITHUB_SHA"; then
            echo 'No changes since the latest release.'
            exit 0
          fi
          if [[ -z "$latest" ]]; then
            next=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.version != '' || (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  binaries:
    needs: [plan, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        include:
          - os: linux
            arch: arm
    env:
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '0'
      VERSION: ${{ needs.plan.outputs.version || '0.0.0-dev' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          mkdir -p dist
          name="fc-eddn-${GOOS}-${GOARCH}"
          [[ "$GOOS" != windows ]] || name="$name.exe"
          GOARM=7 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/$name" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fc-eddn-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  container:
    needs: [plan, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: image
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:sha-$GITHUB_SHA"
          if [[ -n "$VERSION" ]]; then tags="$tags,$image:$VERSION"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.tags }}
          build-args: VERSION=${{ needs.plan.outputs.version || '0.0.0-dev' }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  release:
    needs: [plan, binaries, container]
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fc-eddn-*
          merge-multiple: true
          path: dist
      - run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi
          (cd dist && sha256sum fc-eddn-* > SHA256SUMS)
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
